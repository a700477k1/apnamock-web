  <script>
    const STORAGE_PREFIX = 'apnamock_';
    
    // Database configurations
    const DB_CONFIGS = {
      main: { name: 'ApnaMockDB', version: 2, stores: ['favorites', 'history'] },
      custom: { name: 'ApnaMockCustomDB', version: 1, stores: ['questionUsage'] }
    };

    function showToast(msg, type = 'success') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'check' : 'xmark'}"></i> ${msg}`;
      document.getElementById('toastContainer').appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // --- Flexible IndexedDB Helpers ---
    function openDB(dbName, dbVersion) {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(dbName, dbVersion);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          // Create stores dynamically if they don't exist
          if (dbName === 'ApnaMockDB') {
            if (!db.objectStoreNames.contains('favorites')) db.createObjectStore('favorites', { keyPath: 'qId' });
            if (!db.objectStoreNames.contains('history')) db.createObjectStore('history', { keyPath: 'attemptId' });
          } else if (dbName === 'ApnaMockCustomDB') {
            if (!db.objectStoreNames.contains('questionUsage')) db.createObjectStore('questionUsage', { keyPath: 'qId' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getAllFromStore(dbName, dbVersion, storeName) {
      try {
        const db = await openDB(dbName, dbVersion);
        return new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      } catch (e) {
        return []; // Return empty if DB/Store doesn't exist yet
      }
    }

    async function putData(dbName, dbVersion, storeName, data) {
      if (!data || data.length === 0) return;
      const db = await openDB(dbName, dbVersion);
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        data.forEach(item => store.put(item)); // put() safely merges/overwrites by key
        tx.oncomplete = () => resolve();
      });
    }

    // --- Export Logic ---
    document.getElementById('exportBtn').addEventListener('click', async () => {
      try {
        const btn = document.getElementById('exportBtn');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Preparing...';
        btn.disabled = true;

        const lsData = {};
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith(STORAGE_PREFIX)) {
            lsData[key] = localStorage.getItem(key);
          }
        }

        // Fetch from Main DB
        const favs = await getAllFromStore(DB_CONFIGS.main.name, DB_CONFIGS.main.version, 'favorites');
        const hist = await getAllFromStore(DB_CONFIGS.main.name, DB_CONFIGS.main.version, 'history');
        
        // Fetch from Custom DB
        const usage = await getAllFromStore(DB_CONFIGS.custom.name, DB_CONFIGS.custom.version, 'questionUsage');

        const backup = {
          app: "ApnaMock",
          version: 2, // Incremented backup version
          exportedAt: new Date().toISOString(),
          localStorage: lsData,
          indexedDB: { favorites: favs, history: hist },
          indexedDB_custom: { questionUsage: usage } // Added custom DB data
        };

        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `apnamock-backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        
        showToast('Backup downloaded successfully!');
        btn.innerHTML = '<i class="fa-solid fa-download"></i> Download Backup File';
        btn.disabled = false;
      } catch (err) {
        console.error(err);
        showToast('Failed to export data', 'error');
      }
    });

    // --- Import Logic (Merge Mode) ---
    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importInput').click();
    });

    document.getElementById('importInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const btn = document.getElementById('importBtn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Restoring...';
      btn.disabled = true;
      
      try {
        const text = await file.text();
        const backup = JSON.parse(text);

        if (backup.app !== "ApnaMock") {
          showToast('Invalid backup file', 'error');
          btn.innerHTML = '<i class="fa-solid fa-upload"></i> Select Backup File';
          btn.disabled = false;
          return;
        }

        // 1. Merge LocalStorage (Overwrite existing keys, keep others)
        if (backup.localStorage) {
          for (const [key, value] of Object.entries(backup.localStorage)) {
            localStorage.setItem(key, value);
          }
        }

        // 2. Merge Main IndexedDB
        if (backup.indexedDB) {
          if (backup.indexedDB.favorites) {
            await putData(DB_CONFIGS.main.name, DB_CONFIGS.main.version, 'favorites', backup.indexedDB.favorites);
          }
          if (backup.indexedDB.history) {
            await putData(DB_CONFIGS.main.name, DB_CONFIGS.main.version, 'history', backup.indexedDB.history);
          }
        }

        // 3. Merge Custom IndexedDB (Anti-repetition data)
        if (backup.indexedDB_custom && backup.indexedDB_custom.questionUsage) {
          await putData(DB_CONFIGS.custom.name, DB_CONFIGS.custom.version, 'questionUsage', backup.indexedDB_custom.questionUsage);
        }

        showToast('Data restored! Reloading...');
        setTimeout(() => window.location.href = '/history.html', 1500);
      } catch (err) {
        console.error(err);
        showToast('Error reading backup file', 'error');
        btn.innerHTML = '<i class="fa-solid fa-upload"></i> Select Backup File';
        btn.disabled = false;
      }
    });
  </script>
