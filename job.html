<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

      name="description"
      content="Loading job...">

<meta property="og:title" id="ogTitle" content="Loading Job">

<meta property="og:image" id="ogImage" content="">
<meta property="og:url" id="ogUrl" content="">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

<style>

:root{

--primary:#1a56db;
--primary-dark:#1e429f;
--primary-light:#e8f0fe;

--success:#16a34a;
--success-light:#dcfce7;

--error:#dc2626;
--error-light:#fee2e2;

--bg:#f8fafc;
--card:#ffffff;
--muted:#f1f5f9;

--text:#1e293b;
--text2:#475569;
--text3:#94a3b8;

--border:#e2e8f0;

--radius:18px;

--shadow:0 12px 32px rgba(15,23,42,.08);

}

body.dark-mode{

--bg:#0f172a;
--card:#1e293b;
--muted:#334155;

--text:#f8fafc;
--text2:#cbd5e1;
--text3:#94a3b8;

--border:#334155;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Inter,sans-serif;

background:var(--bg);

color:var(--text);

line-height:1.7;

}

img{

display:block;

max-width:100%;

}

a{

text-decoration:none;

color:inherit;

}

.header{

position:sticky;

top:0;

z-index:100;

background:var(--card);

border-bottom:1px solid var(--border);

}

.header-inner{

max-width:1200px;

margin:auto;

padding:0 20px;

height:64px;

display:flex;

justify-content:space-between;

align-items:center;

}

.brand{

display:flex;

align-items:center;

gap:10px;

}

.brand-icon{

width:36px;

height:36px;

border-radius:10px;

background:linear-gradient(135deg,#1a56db,#f97316);

display:flex;

align-items:center;

justify-content:center;

color:#fff;

font-weight:700;

}

.brand-name{

font-family:Poppins,sans-serif;

font-size:18px;

font-weight:700;

color:var(--primary);

}

.container{

max-width:1000px;

margin:auto;

padding:30px 20px 80px;

}

.breadcrumb{

font-size:13px;

color:var(--text3);

margin-bottom:20px;

}

.breadcrumb a{

color:var(--primary);

}

.job-card{

background:var(--card);

border:1px solid var(--border);

border-radius:20px;

overflow:hidden;

box-shadow:var(--shadow);

}

.hero-image{

width:100%;

height:320px;

object-fit:cover;

background:#ddd;

}

.job-body{

padding:28px;

}

.top-row{

display:flex;

justify-content:space-between;

align-items:center;

gap:15px;

margin-bottom:18px;

flex-wrap:wrap;

}

.category{

padding:6px 14px;

background:var(--primary-light);

color:var(--primary);

border-radius:999px;

font-size:12px;

font-weight:700;

}

.status{

padding:6px 14px;

border-radius:999px;

font-size:12px;

font-weight:700;

}

.status.active{

background:var(--success-light);

color:var(--success);

}

.status.expired{

background:var(--error-light);

color:var(--error);

}

.job-title{

font-family:Poppins,sans-serif;

font-size:32px;

font-weight:700;

margin-bottom:8px;

line-height:1.3;

}

.company{

display:flex;

align-items:center;

gap:8px;

font-size:15px;

color:var(--text2);

margin-bottom:25px;

}

.meta-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:16px;

margin-bottom:28px;

}

.meta{

background:var(--muted);

padding:16px;

border-radius:14px;

}

.meta small{

display:block;

font-size:11px;

text-transform:uppercase;

color:var(--text3);

margin-bottom:6px;

}

.meta strong{

font-size:15px;

}

.description{

font-size:15px;

line-height:1.9;

color:var(--text2);

}

.description img{

max-width:100%;

margin:20px auto;

border-radius:12px;

}

.description table{

width:100%;

border-collapse:collapse;

margin:18px 0;

}

.description td,
.description th{

border:1px solid var(--border);

padding:10px;

}

.action-bar{

display:flex;

gap:12px;

margin-top:30px;

flex-wrap:wrap;

}

.btn{

height:44px;

padding:0 22px;

display:inline-flex;

align-items:center;

justify-content:center;

gap:8px;

border-radius:12px;

font-weight:600;

}

.btn-primary{

background:var(--primary);

color:#fff;

}

.btn-outline{

border:1px solid var(--primary);

color:var(--primary);

}

.related{

margin-top:50px;

}

.related h2{

font-size:22px;

margin-bottom:18px;

font-family:Poppins,sans-serif;

}

.footer{

margin-top:80px;

padding:40px;

text-align:center;

font-size:13px;

color:var(--text3);

border-top:1px solid var(--border);

}

.loading{

padding:120px;

text-align:center;

color:var(--text3);

}

@media(max-width:768px){

.container{

padding:18px 12px 60px;

}

.hero-image{

height:220px;

}

.job-body{

padding:20px;

}

.job-title{

font-size:24px;

}

.meta-grid{

grid-template-columns:1fr;

}

.action-bar{

flex-direction:column;

}

.btn{

width:100%;

}

}

</style>

</head>

<body>

<header class="header">

<div class="header-inner">

<a class="brand" href="/index.html">

<div class="brand-icon">
A
</div>

<div class="brand-name">
ApnaMock
</div>

</a>

</div>

</header>

<div class="container">

<div class="breadcrumb">

<a href="jobs.html">
← Back to Jobs
</a>

</div>

<div id="jobRoot">

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"
style="font-size:32px;margin-bottom:15px;"></i>

<div>

Loading job...

</div>

</div>

</div>

</div>

<footer class="footer">

© 2025 ApnaMock • Practice. Improve. Succeed.

</footer>

</body>
</html>
